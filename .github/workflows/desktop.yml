# Builds Tek for Windows and macOS. A pushed tag (v1.2.3) also publishes the
# files as a GitHub release; a test tag (v1.2.3-rc.1) or a manual run only
# keeps them as build artifacts.
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.8
  GO_VERSION: 1.26.10
  # https://www.wintun.net, the official build
  WINTUN_URL: https://www.wintun.net/builds/wintun-0.14.1.zip
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Version
        shell: bash
        run: tool/ci/version.sh >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Core
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -buildid= -H windowsgui -X main.version=$env:VERSION" -o ../dist/core/tek-core.exe ./cmd/tek-core

      - name: Wintun
        run: |
          Invoke-WebRequest $env:WINTUN_URL -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINTUN_SHA256) { throw "wintun.zip hash mismatch: $hash" }
          Expand-Archive wintun.zip -DestinationPath dist/wintun

      - name: App
        working-directory: app
        run: flutter build windows --release --build-name $env:VERSION --build-number $env:BUILD

      - name: Bundle
        run: |
          $out = "app/build/windows/x64/runner/Release"
          Copy-Item dist/core/tek-core.exe $out
          Copy-Item dist/wintun/wintun/bin/amd64/wintun.dll $out
          # The Visual C++ runtime goes next to Tek.exe, so a fresh Windows
          # needs nothing else installed.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) $out
          }
          New-Item -ItemType Directory -Force "$out/licenses" | Out-Null
          Copy-Item dist/wintun/wintun/LICENSE.txt "$out/licenses/wintun.txt"
          Get-ChildItem $out | Format-Table Name, Length

      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" app/windows/installer/tek.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "dist/Tek-$env:VERSION-windows-x64-portable.zip"
          Get-ChildItem dist -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Tek-*-setup.exe
            dist/Tek-*-portable.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: tool/ci/version.sh >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Core (Apple silicon and Intel)
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "-s -w -buildid= -X main.version=$VERSION" -o ../dist/core/tek-core-$arch ./cmd/tek-core
          done
          lipo -create -output ../dist/core/tek-core ../dist/core/tek-core-arm64 ../dist/core/tek-core-amd64
          lipo -info ../dist/core/tek-core

      - name: App
        working-directory: app
        run: flutter build macos --release --build-name "$VERSION" --build-number "$BUILD"

      - name: Bundle and sign
        run: |
          APP=app/build/macos/Build/Products/Release/Tek.app
          cp dist/core/tek-core "$APP/Contents/MacOS/tek-core"
          chmod 755 "$APP/Contents/MacOS/tek-core"
          # Ad-hoc signature: enough for macOS to run it; the person allows
          # the app once in Privacy & Security.
          codesign --force --sign - "$APP/Contents/MacOS/tek-core"
          codesign --force --sign - --entitlements app/macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/Tek"

      - name: Disk image
        run: |
          mkdir -p dmg
          cp -R app/build/macos/Build/Products/Release/Tek.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Tek -srcfolder dmg -ov -format UDZO "dist/Tek-$VERSION-macos.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Tek-*-macos.dmg
          if-no-files-found: error

  release:
    # A test tag such as v1.2.3-rc.1 only builds; v1.2.3 also publishes.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          (cd out && sha256sum * > SHA256SUMS-desktop.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Tek ${TAG#v}" --notes "Tek ${TAG#v}" --verify-tag
          fi
          gh release upload "$TAG" out/* --clobber
